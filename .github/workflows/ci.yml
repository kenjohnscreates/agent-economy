name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        # version resolved from root package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Direct tarball: foundryup attestation downloads are 502/500 as of 9 Sep 2026.
      - name: Install Foundry
        run: |
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/v1.8.1/foundry_v1.8.1_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          forge --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present lint
