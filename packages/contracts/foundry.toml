[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# Arc does not implement the PUSH0 opcode (0x5f), which solc emits by default
# for evm_version >= "shanghai". Targeting "paris" makes the compiler fall back
# to PUSH1 0x00, so bytecode deploys and executes on Arc Testnet/Mainnet.
# Verify with: forge build --evm-version paris
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "../ens/town.json" },
    { access = "read", path = "../ens/deployments.json" },
    { access = "read", path = "../circle/roster.json" },
]

# RPC URLs come from env vars only; never hardcode endpoints or keys here.
[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Invariant handlers are written to never revert; any revert is a real bug in handler or contract.
[invariant]
fail_on_revert = true
